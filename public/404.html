<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — IVXNCHIS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>
  (function(d){
    try{ var t = localStorage.getItem('theme'); if(t === 'light' || t === 'dark') d.dataset.theme = t; }catch(e){}
    try{ var g = parseFloat(localStorage.getItem('glassTint')); if(g >= 0 && g <= 1) d.style.setProperty('--glass-tint', g); }catch(e){}
  })(document.documentElement);
</script>
<style>
  main{
    max-width:460px;
    margin:0 auto;
    padding: 18vh 1.25rem 4rem;
  }
  .window{ overflow:hidden; }
  .alert{
    display:flex;
    gap:1rem;
    padding:1.5rem 1.4rem 1.3rem;
  }
  .alert .avatar-ring{ width:52px; height:52px; border-radius:12px; font-size:0.95rem; margin:0; flex-shrink:0; }
  .alert h1{ font-size:1rem; margin:0 0 0.35rem; }
  .alert p{ font-size:0.88rem; line-height:1.5; margin:0; color:var(--ink-soft); }
  .alert code{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:0.82rem; word-break:break-all; }
  .buttons{ display:flex; justify-content:flex-end; gap:0.6rem; padding:0 1.4rem 1.3rem; }
  .btn{
    display:inline-block;
    padding:0.45rem 1.1rem;
    border-radius:999px;
    font-size:0.85rem;
    font-weight:500;
    text-decoration:none;
    border:0;
    color:var(--ink);
    background:var(--hover);
  }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
</style>
</head>
<body>

<header class="menubar">
  <div class="menubar-left" role="menubar" aria-label="Menu bar">
    <button type="button" class="brand menu-title" id="mb-brand" data-menu="brand" role="menuitem" aria-haspopup="menu" aria-expanded="false">IVXNCHIS</button>
    <button type="button" class="menu-item menu-title" id="mb-file" data-menu="file" role="menuitem" aria-haspopup="menu" aria-expanded="false" tabindex="-1">File</button>
    <button type="button" class="menu-item menu-title" id="mb-edit" data-menu="edit" role="menuitem" aria-haspopup="menu" aria-expanded="false" tabindex="-1">Edit</button>
    <button type="button" class="menu-item menu-title" id="mb-view" data-menu="view" role="menuitem" aria-haspopup="menu" aria-expanded="false" tabindex="-1">View</button>
    <button type="button" class="menu-item menu-title" id="mb-window" data-menu="window" role="menuitem" aria-haspopup="menu" aria-expanded="false" tabindex="-1">Window</button>
    <button type="button" class="menu-item menu-title" id="mb-help" data-menu="help" role="menuitem" aria-haspopup="menu" aria-expanded="false" tabindex="-1">Help</button>
  </div>
  <div class="menubar-right">
    <span class="loc-text">Bucaramanga, CO</span>
    <span id="clock"></span>
  </div>
</header>

<main>
  <section class="window" data-close-href="/" role="alertdialog" aria-labelledby="nf-title" aria-describedby="nf-desc">
    <div class="window-header">
      <div class="traffic"><button type="button" class="r" data-win="close" aria-label="Close"></button><button type="button" class="y" data-win="minimize" aria-label="Minimize"></button><button type="button" class="g" data-win="zoom" aria-label="Zoom"></button></div>
      <p class="window-title">Finder</p>
    </div>
    <div class="alert">
      <div class="avatar-ring tile" aria-hidden="true">IS</div>
      <div>
        <h1 id="nf-title">The item can't be found.</h1>
        <p id="nf-desc">Nothing lives at <code id="path"></code>. It may have been moved or renamed.</p>
      </div>
    </div>
    <div class="buttons">
      <a class="btn" href="/about">About</a>
      <a class="btn primary" href="/">Go Home</a>
    </div>
  </section>
</main>

<script>document.getElementById('path').textContent = location.pathname;</script>
<script src="/site.js"></script>
<script src="/desktop.js"></script>
</body>
</html>
